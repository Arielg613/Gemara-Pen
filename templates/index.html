<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemara Pen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f4ede0;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      color: #2c1810;
    }

    .container { max-width: 820px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.2rem; letter-spacing: 0.02em; }
    header p  { color: #7a5c3a; font-style: italic; margin-top: 0.3rem; font-size: 0.95rem; }

    /* Word input */
    .word-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: stretch;
    }
    #word {
      flex: 1;
      direction: rtl;
      font-size: 1.5rem;
      font-family: 'SBL Hebrew', 'Ezra SIL', 'Frank Ruehl CLM', 'Times New Roman', serif;
      padding: 0.6rem 0.9rem;
      border: 1px solid #c4ad8a;
      border-radius: 6px;
      background: #fffdf7;
      color: #1a1008;
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border: 1px solid #c4ad8a;
      border-radius: 6px;
      overflow: hidden;
    }
    .tab {
      flex: 1;
      padding: 0.6rem;
      background: #fffdf7;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: #7a5c3a;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tab.active {
      background: #7a3b10;
      color: #fff;
      font-weight: bold;
    }
    .tab:not(.active):hover { background: #f0e6d4; }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Dictionary panel */
    .lookup-btn {
      width: 100%;
      padding: 0.75rem;
      background: #7a3b10;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lookup-btn:hover   { background: #9a4d1a; }
    .lookup-btn:disabled { background: #b89a7a; cursor: not-allowed; }

    /* Pre-cache bar */
    .precache-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      padding: 0.55rem 0.8rem;
      background: #f0e6d4;
      border: 1px solid #c4ad8a;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #5a3e28;
    }
    .precache-btn {
      padding: 0.35rem 0.9rem;
      background: #4a7c4a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .precache-btn:hover    { background: #3a6c3a; }
    .precache-btn:disabled { background: #8ab08a; cursor: not-allowed; }
    .precache-msg { flex: 1; }

    /* Search panel */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field.grow { flex: 1; min-width: 140px; }
    label { font-size: 0.75rem; font-weight: bold; color: #5a3e28; text-transform: uppercase; letter-spacing: 0.04em; }

    select {
      padding: 0.5rem 0.65rem;
      border: 1px solid #c4ad8a;
      border-radius: 4px;
      background: #fffdf7;
      font-family: inherit;
      font-size: 0.95rem;
      color: #2c1810;
    }

    .search-btn {
      padding: 0.55rem 1.4rem;
      background: #7a3b10;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .search-btn:hover   { background: #9a4d1a; }
    .search-btn:disabled { background: #b89a7a; cursor: not-allowed; }

    /* Status */
    #status {
      text-align: center;
      font-style: italic;
      color: #7a5c3a;
      min-height: 1.4rem;
      margin: 0.5rem 0;
    }

    /* Jastrow result */
    /* Morphology breakdown strip */
    .morph-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: #f0f4ff;
      border: 1px solid #c7d4f0;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      margin-bottom: 0.85rem;
      font-size: 0.9rem;
      direction: rtl;
    }
    .morph-word { font-size: 1.4rem; letter-spacing: 0.04em; }
    .morph-prefix { color: #1e6b2e; font-weight: 700; background: #d4f0dc; border-radius: 3px; padding: 0 3px; }
    .morph-root   { color: #1a1a1a; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    .morph-suffix { color: #7c3700; font-weight: 700; background: #ffe5c7; border-radius: 3px; padding: 0 3px; }
    .morph-arrow  { color: #888; font-size: 1rem; direction: ltr; }
    .morph-label  { color: #444; font-size: 0.82rem; direction: ltr; flex: 1 1 100%; margin-top: 0.25rem; }
    .morph-inline-prefix { color: #1e6b2e; font-weight: 700; background: #d4f0dc; border-radius: 3px; padding: 0 3px; }
    .morph-inline-suffix { color: #7c3700; font-weight: 700; background: #ffe5c7; border-radius: 3px; padding: 0 3px; }

    .jastrow-card {
      background: #fffdf7;
      border: 1px solid #d4c4a8;
      border-left: 4px solid #4a7c4a;
      border-radius: 6px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1rem;
    }
    .jastrow-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .jastrow-hw {
      direction: rtl;
      font-family: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif;
      font-size: 1.5rem;
      color: #1a1008;
    }
    .lang-badge {
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lang-hebrew  { background: #d4eaff; color: #1a4a7a; }
    .lang-aramaic { background: #fde8c8; color: #7a3b10; }
    .lang-both    { background: #e8d4f0; color: #4a1a6a; }
    .jastrow-def {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #2c1810;
    }
    .jastrow-source {
      font-size: 0.75rem;
      color: #a08060;
      margin-top: 0.5rem;
      font-style: italic;
    }

    /* Passage results */
    .result-count { color: #5a3e28; font-weight: bold; margin-bottom: 1rem; }

    .result-card {
      background: #fffdf7;
      border: 1px solid #d4c4a8;
      border-left: 4px solid #7a3b10;
      border-radius: 4px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1rem;
    }
    .result-meta { font-size: 0.75rem; color: #a08060; margin-bottom: 0.6rem; }
    .aramaic {
      direction: rtl;
      font-family: 'SBL Hebrew', 'Ezra SIL', 'Frank Ruehl CLM', 'Times New Roman', serif;
      font-size: 1.2rem;
      line-height: 2;
      background: #f4ede0;
      padding: 0.6rem 0.8rem;
      border-radius: 3px;
      margin-bottom: 0.8rem;
      color: #1a1008;
    }
    .english { font-size: 0.92rem; line-height: 1.65; color: #3a2a1a; }

    .context-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .ctx-label { font-size: 0.78rem; font-weight: bold; color: #5a3e28; }
    .ctx-select {
      padding: 0.45rem 0.65rem;
      border: 1px solid #c4ad8a;
      border-radius: 4px;
      background: #fffdf7;
      font-family: inherit;
      font-size: 0.9rem;
      color: #2c1810;
      max-width: 320px;
    }

    .context-badge {
      display: inline-block;
      font-size: 0.72rem;
      background: #d4f0dc;
      color: #1e5a2e;
      border-radius: 3px;
      padding: 0.15rem 0.45rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .phrase-banner {
      background: #1a4a7a;
      color: #e8f0ff;
      font-size: 1.15rem;
      font-family: Georgia, serif;
      padding: 0.9rem 1.3rem;
      border-radius: 6px;
      margin-bottom: 0.85rem;
      text-align: center;
    }
    .phrase-label {
      font-size: 0.75rem;
      color: #9ab8d8;
      margin-top: 0.35rem;
    }

    .abbrev-banner {
      background: #4a3a1a;
      color: #f4e8c8;
      font-size: 1.15rem;
      font-family: Georgia, serif;
      padding: 0.9rem 1.3rem;
      border-radius: 6px;
      margin-bottom: 0.85rem;
      text-align: center;
    }
    .abbrev-label {
      font-size: 0.75rem;
      color: #c8b890;
      margin-top: 0.35rem;
    }

    .version-badge {
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      background: #7a3b10;
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      vertical-align: middle;
      font-style: normal;
    }

    .gloss-banner {
      background: #2c1810;
      color: #f4ede0;
      font-size: 1.25rem;
      font-family: Georgia, serif;
      padding: 0.9rem 1.3rem;
      border-radius: 6px;
      margin-bottom: 0.85rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .jastrow-full-toggle {
      font-size: 0.78rem;
      color: #7a5c3a;
      cursor: pointer;
      margin-top: 0.5rem;
      display: inline-block;
      user-select: none;
    }
    .jastrow-full-toggle:hover { text-decoration: underline; }
    .jastrow-full-body { display: none; margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid #e0d4b8; }
    .jastrow-full-body.open { display: block; }

    mark { background: #f5d76e; color: inherit; border-radius: 2px; padding: 0 1px; }

    .empty {
      text-align: center;
      padding: 2rem;
      color: #9a7a5a;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>Gemara Pen <span class="version-badge">v2.1</span></h1>
    <p>Aramaic &amp; Hebrew dictionary for Talmud study</p>
  </header>

  <!-- Word input (shared by both modes) -->
  <div class="word-row">
    <input id="word" type="text" placeholder="e.g. אחז" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <!-- Mode tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setMode('lookup')">📖 Dictionary</button>
    <button class="tab" onclick="setMode('search')">🔍 Search Passages</button>
  </div>

  <!-- Dictionary panel -->
  <div id="panel-lookup" class="panel active">
    <div class="context-row">
      <label for="ctx-tractate" class="ctx-label">📍 Current tractate <span style="font-weight:normal;color:#9a7a5a">(optional — gives context-aware definitions)</span></label>
      <select id="ctx-tractate" class="ctx-select">
        <option value="">— no context —</option>
      </select>
    </div>
    <button class="lookup-btn" id="lookup-btn" onclick="doLookup()">Look Up</button>
  </div>

  <!-- Search Passages panel -->
  <div id="panel-search" class="panel">
    <div class="precache-bar">
      <button class="precache-btn" id="precache-btn" onclick="doPreCache()">⚡ Pre-load All</button>
      <span class="precache-msg" id="precache-msg">Load all 37 tractates into memory for instant searches</span>
    </div>
    <div class="filters">

      <div class="field grow">
        <label for="tractate">Tractate</label>
        <select id="tractate"></select>
      </div>

      <div class="field">
        <label for="daf">Daf</label>
        <select id="daf"></select>
      </div>

      <div class="field">
        <label for="amud">Amud</label>
        <select id="amud">
          <option value="a">a</option>
          <option value="b">b</option>
        </select>
      </div>

      <button class="search-btn" id="search-btn" onclick="doSearch()">Search</button>

    </div>
  </div>

  <div id="status"></div>
  <div id="results"></div>

</div>

<script>
  const TRACTATES = {{ tractate_max_daf | tojson }};

  // --- Mode switching ---
  function setMode(mode) {
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0) === (mode === 'lookup'))
    );
    document.getElementById('panel-lookup').classList.toggle('active', mode === 'lookup');
    document.getElementById('panel-search').classList.toggle('active', mode === 'search');
    document.getElementById('results').innerHTML = '';
    document.getElementById('status').textContent = '';
  }

  // --- Context tractate selector (Dictionary panel) ---
  const ctxTractate = document.getElementById('ctx-tractate');
  Object.keys(TRACTATES).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    ctxTractate.appendChild(opt);
  });

  // --- Tractate / daf dropdowns ---
  const tractateSelect = document.getElementById('tractate');
  const dafSelect      = document.getElementById('daf');

  // "All Tractates" sentinel option
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = '📚 All Tractates';
  tractateSelect.appendChild(allOpt);

  Object.keys(TRACTATES).sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    tractateSelect.appendChild(opt);
  });

  function refreshDaf() {
    const isAll = tractateSelect.value === 'all';
    dafSelect.disabled = isAll;
    document.getElementById('amud').disabled = isAll;
    if (isAll) { dafSelect.innerHTML = '<option value="">—</option>'; return; }
    const maxDaf = TRACTATES[tractateSelect.value] || 64;
    dafSelect.innerHTML = '<option value="">All daf</option>';
    for (let d = 2; d <= maxDaf; d++) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      dafSelect.appendChild(opt);
    }
  }
  tractateSelect.addEventListener('change', refreshDaf);
  refreshDaf();

  // Enter key works in both modes
  document.getElementById('word').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const lookupActive = document.getElementById('panel-lookup').classList.contains('active');
    lookupActive ? doLookup() : doSearch();
  });

  // --- Jastrow lookup ---
  async function doLookup() {
    const word     = document.getElementById('word').value.trim();
    const tractate = ctxTractate.value;
    const btn      = document.getElementById('lookup-btn');
    const status   = document.getElementById('status');
    const results  = document.getElementById('results');

    if (!word) { status.textContent = 'Enter a word first.'; return; }

    btn.disabled = true;
    status.textContent = 'Looking up…';
    results.innerHTML = '';

    try {
      const res  = await fetch('/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word, tractate }),
      });
      const data = await res.json();
      status.textContent = '';

      if (data.error) { status.textContent = `Error: ${data.error}`; return; }

      if (data.type === 'abbreviation') { renderAbbrev(data); return; }
      if (data.type === 'phrase')       { renderPhrase(data); return; }
      renderJastrow(data);

    } catch (_) {
      status.textContent = 'Network error.';
    } finally {
      btn.disabled = false;
    }
  }

  function renderAbbrev(data) {
    document.getElementById('results').innerHTML = `
      <div class="abbrev-banner">
        <div>${esc(data.gloss)}</div>
        <div class="abbrev-label">Abbreviation · ${esc(data.full || '')}</div>
      </div>`;
  }

  function renderPhrase(data) {
    document.getElementById('results').innerHTML = `
      <div class="phrase-banner">
        <div>${esc(data.gloss)}</div>
        <div class="phrase-label">Talmudic phrase · ${esc(data.word)}</div>
      </div>`;
  }

  function renderMorphology(data) {
    // Build the coloured word breakdown: prefix | root | suffix
    const m = data.morphology;
    if (!m || (!m.prefix && !m.suffix)) return '';
    const pre = m.prefix || '';
    const suf = m.suffix || '';
    const root = m.root || data.word;
    let parts = '';
    if (pre) parts += `<span class="morph-prefix">${esc(pre)}</span>`;
    parts += `<span class="morph-root">${esc(root)}</span>`;
    if (suf) parts += `<span class="morph-suffix">${esc(suf)}</span>`;
    const labels = [];
    if (pre) labels.push(`prefix <span class="morph-inline-prefix">${esc(pre)}</span>`);
    if (suf) labels.push(`suffix <span class="morph-inline-suffix">${esc(suf)}</span>`);
    return `<div class="morph-strip">
      <span class="morph-word">${parts}</span>
      <span class="morph-arrow">→</span>
      <span class="morph-label">stripped ${labels.join(', ')} → root <strong>${esc(root)}</strong></span>
    </div>`;
  }

  function renderJastrow(data) {
    const el = document.getElementById('results');

    if (!data.found && !data.gloss) {
      el.innerHTML = `<div class="empty">
        <strong>${esc(data.word)}</strong> not found in Jastrow.<br>
        <small>Try the root form — e.g. אחז instead of אוחזין</small>
      </div>`;
      return;
    }

    const LANG_LABEL = {
      hebrew:  ['Hebrew',          'lang-hebrew'],
      aramaic: ['Aramaic',         'lang-aramaic'],
      both:    ['Hebrew & Aramaic','lang-both'],
      unknown: [null, null],
    };

    const morphHtml = renderMorphology(data);
    let html = morphHtml;

    // Context badge — shown when the entry was picked specifically for this tractate
    if (data.context_sense && data.tractate) {
      html += `<div class="context-badge">📍 Context: ${esc(data.tractate)}</div>`;
    }

    // Gloss banner — the clean short answer, always shown first
    if (data.gloss) {
      html += `<div class="gloss-banner">${esc(data.gloss)}</div>`;
    }

    for (const e of data.entries) {
      const [label, cls] = LANG_LABEL[e.lang] || [null, null];
      const badge = label ? `<span class="lang-badge ${cls}">${label}</span>` : '';
      const uid = Math.random().toString(36).slice(2);
      html += `
        <div class="jastrow-card">
          <div class="jastrow-header">
            <div class="jastrow-hw">${esc(e.hw)}</div>
            ${badge}
          </div>
          <span class="jastrow-full-toggle" onclick="toggleFull('${uid}')">▸ Full Jastrow entry</span>
          <div class="jastrow-full-body" id="full-${uid}">
            <div class="jastrow-def">${esc(e.def)}</div>
          </div>
          <div class="jastrow-source">Jastrow's Dictionary</div>
        </div>`;
    }
    el.innerHTML = html;
  }

  function toggleFull(uid) {
    const body = document.getElementById('full-' + uid);
    const toggle = body.previousElementSibling;
    const open = body.classList.toggle('open');
    toggle.textContent = (open ? '▾' : '▸') + ' Full Jastrow entry';
  }

  // --- Passage search ---
  async function doSearch() {
    const word     = document.getElementById('word').value.trim();
    const tractate = tractateSelect.value;
    const daf      = dafSelect.value;
    const amud     = document.getElementById('amud').value;
    const btn      = document.getElementById('search-btn');
    const status   = document.getElementById('status');
    const results  = document.getElementById('results');

    if (!word) { status.textContent = 'Enter a word first.'; return; }

    btn.disabled = true;
    const loc = tractate === 'all' ? 'all tractates (may take a moment…)'
              : daf ? `${tractate} ${daf}${amud}` : `all of ${tractate}`;
    status.textContent = `Searching ${loc}…`;
    results.innerHTML = '';

    try {
      const res  = await fetch('/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word, tractate, daf, amud }),
      });
      const data = await res.json();
      status.textContent = '';

      if (data.error) { status.textContent = `Error: ${data.error}`; return; }
      renderPassages(data);

    } catch (_) {
      status.textContent = 'Network error.';
    } finally {
      btn.disabled = false;
    }
  }

  function renderPassages(data) {
    const el = document.getElementById('results');

    if (!data.results.length) {
      el.innerHTML = `<div class="empty">
        No passages found for <strong>${esc(data.word)}</strong> in ${esc(data.tractate)}${data.daf ? ' ' + esc(data.daf) : ''}.
      </div>`;
      return;
    }

    const scope = data.daf ? `${esc(data.tractate)} ${esc(data.daf)}` : esc(data.tractate);
    let html = `<p class="result-count">${data.total} passage${data.total !== 1 ? 's' : ''} in ${scope}</p>`;

    for (const r of data.results) {
      const tractateLabel = data.all_tractates && r.tractate ? esc(r.tractate) + ' · ' : '';
      const dafLabel = r.daf ? `Daf ${r.daf}` : '';
      const metaLine = tractateLabel + (dafLabel ? dafLabel + ` · Segment ${r.segment}` : `Segment ${r.segment}`);
      html += `
        <div class="result-card">
          <div class="result-meta">${metaLine}</div>
          <div class="aramaic">${highlight(r.aramaic, data.word)}</div>
          <div class="english">${r.english || '<em>(translation not available)</em>'}</div>
        </div>`;
    }

    el.innerHTML = html;
  }

  // --- Pre-cache ---
  async function doPreCache() {
    const btn = document.getElementById('precache-btn');
    const msg = document.getElementById('precache-msg');
    btn.disabled = true;

    try {
      const res  = await fetch('/precache', { method: 'POST' });
      const data = await res.json();
      if (data.already_running) { msg.textContent = 'Already loading…'; }
    } catch (_) {
      msg.textContent = 'Failed to start. Try again.';
      btn.disabled = false;
      return;
    }

    // Poll every second until done
    const poll = setInterval(async () => {
      try {
        const res  = await fetch('/precache/status');
        const data = await res.json();
        const pct  = data.total ? Math.round((data.loaded / data.total) * 100) : 0;
        msg.textContent = `Loading… ${data.loaded}/${data.total} tractates (${pct}%)`;

        if (data.status === 'done') {
          clearInterval(poll);
          if (data.errors && data.errors.length) {
            msg.textContent = `✓ ${data.loaded - data.errors.length}/${data.total} loaded (${data.errors.length} failed)`;
          } else {
            msg.textContent = `✓ All ${data.loaded} tractates loaded — searches are now instant!`;
            btn.textContent = '✓ Loaded';
          }
        }
      } catch (_) { /* ignore transient poll errors */ }
    }, 1000);
  }

  // --- Helpers ---
  function highlight(html, word) {
    const bare = word.replace(/[֑-ׇ]/g, '');
    if (!bare) return html;
    const letters = [...bare].map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const pattern = letters.join('[\\u0591-\\u05C7]*');
    const re = new RegExp(`(<[^>]*>)|(${pattern})`, 'g');
    return html.replace(re, (match, tag) => tag ? tag : `<mark>${match}</mark>`);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
